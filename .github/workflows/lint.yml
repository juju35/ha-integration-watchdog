name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  ruff:
    name: Ruff (annotations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same ruff as .pre-commit-config.yaml, read from it so that a Dependabot bump there is followed here.
      - name: Ruff version
        id: version
        run: |
          v="$(grep -A1 'astral-sh/ruff-pre-commit' .pre-commit-config.yaml | sed -n 's/.*rev: *"\{0,1\}v\([0-9.]*\)"\{0,1\}.*/\1/p')"
          [ -n "$v" ] || { echo "::error::ruff version not found in .pre-commit-config.yaml"; exit 1; }
          echo "ruff=$v" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: ${{ steps.version.outputs.ruff }}
  biome:
    name: Biome (card JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same Biome as the pre-commit hook, read from .pre-commit-config.yaml.
      - name: Biome version
        id: version
        run: |
          v="$(sed -n 's/.*@biomejs\/biome@\([0-9.]*\).*/\1/p' .pre-commit-config.yaml | head -n 1)"
          [ -n "$v" ] || { echo "::error::Biome version not found in .pre-commit-config.yaml"; exit 1; }
          echo "biome=$v" >> "$GITHUB_OUTPUT"
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2
        with:
          version: ${{ steps.version.outputs.biome }}
      - run: biome ci --reporter=github .
  duplication:
    name: Duplication (jscpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npx --yes jscpd@5.4.2 .
      - name: Annotate duplicates
        if: always()
        run: node .github/scripts/jscpd-annotate.mjs
  dead-code:
    name: Dead code (vulture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install vulture==2.16
      - run: vulture custom_components .vulture_whitelist.py --min-confidence 60
